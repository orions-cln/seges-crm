<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121A33">
  <title>SEGES – Mini-CRM</title>
  <link rel="stylesheet" href="css/app.css?v=2">
  <script src="js/app.js?v=2" defer></script>
</head>
<body>
  <header class="barra">
    <div class="marca">SEGES <span>Mini-CRM</span></div>
    <div class="usuario"><span id="usrNombre"></span><button id="btnSalir" class="btn-link" type="button">Salir</button></div>
    <nav id="nav"></nav>
  </header>

  <main id="vista"></main>

  <section id="login" class="login oculto">
    <form id="formLogin" class="login-caja">
      <div class="marca grande">SEGES</div>
      <p>Mini-CRM de atención al cliente</p>
      <label>Correo<input name="correo" type="email" autocomplete="username" required></label>
      <label>PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
      <p class="ayuda centro"><a href="pin.html">¿Primera vez o olvidaste tu PIN?</a></p>
    </form>
  </section>

  <div id="modal" class="modal oculto"><div class="modal-caja"><div id="modalCuerpo"></div></div></div>
  <div id="aviso" class="aviso oculto"></div>
  <noscript><p class="sin-js">Activa JavaScript para usar el CRM.</p></noscript>
</body>
</html>
